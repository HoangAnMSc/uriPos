# Render Blueprint for this monorepo.
# Backend runs as a Docker web service because Render does not provide a native PHP runtime.
# If you want a Render-managed database, create a Postgres instance separately and set its
# Internal Database URL as `DB_URL` on `apos-backend`.
# Render's current free Postgres plan expires 30 days after creation.

services:
  - type: web
    name: apos-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /up
    preDeployCommand: sh -c 'php artisan migrate --force && if [ "${RUN_SEED_ON_DEPLOY}" = "true" ]; then php artisan db:seed --force; fi'
    envVars:
      - key: APP_NAME
        value: Apos
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: apos-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STACK
        value: single
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        sync: false
      - key: DB_URL
        sync: false
      - key: RUN_SEED_ON_DEPLOY
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_DOMAIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: apos-storefront
    runtime: static
    rootDir: react-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./react-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: apos-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: apos-admin
    runtime: static
    rootDir: react-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./react-admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: apos-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_STOREFRONT_URL
        fromService:
          type: web
          name: apos-storefront
          envVarKey: RENDER_EXTERNAL_URL
